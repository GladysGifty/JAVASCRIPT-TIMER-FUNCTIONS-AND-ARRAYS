
<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
    <style>
        body {
            background-color: #e6e6fa;
            text-align: center;
            font-family: Arial;
            padding: 50px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            margin: auto;
        }
        h1 {
            color: #663399;
        }
        #time {
            font-size: 30px;
            color: #45216b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Digital Clock!</h1>
        <span id="time"></span>
    </div>

    <script>
        function display() {
            var d = new Date();

            var hour = d.getHours();
            var minute = d.getMinutes();
            var second = d.getSeconds();

            document.getElementById("time").innerHTML =
                hour + ":" + minute + ":" + second;
        }

        display();
        setInterval(display, 1000);
    </script>

</body>
</html>
